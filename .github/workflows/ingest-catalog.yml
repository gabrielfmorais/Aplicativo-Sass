name: ingest-catalog

# SPEC-057 (F32) — popula o catálogo real (`catalog_products`) a partir de Open Beauty Facts, no
# projeto **DEV**, por decisão manual.
#
# Por que aqui (o mesmo motivo do deploy-dev-functions): a exportação da OBF é grande e a escrita no
# DEV precisa de credencial que só o CI tem. O token do dono já vive como secret do repositório, e o
# runner é Linux (o Supabase CLI falha com `spawn UNKNOWN` no Windows do dono). A ingestão usa a
# **exportação oficial**, nunca varredura da API (regra da OBF), e escreve via a Management API — o
# `service_role`/token nunca sai do runner.
#
# **Manual only.** Escrever no banco é ação §4: uma decisão que alguém toma, nunca efeito de merge.
# Sem trigger `push:` de propósito.
#
# **DEV only.** O ref é constante, não input: um workflow que aceita ref arbitrário está a um paste de
# escrever em produção.
#
# NÃO é required status check — não roda em pull_request, então a proteção de branch ficaria "Expected"
# para sempre (LEVEL 2).

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Máximo de produtos a ingerir (priorizados: Brasil, com foto, mais completos)'
        required: false
        default: '2500'

permissions:
  contents: read

concurrency:
  group: ingest-catalog
  cancel-in-progress: false

env:
  # O projeto DEV (`hair-care-dev`). Ref não é segredo — é o host da URL pública do Supabase.
  SUPABASE_PROJECT_REF: ayecidupmxmirwfzwtea

jobs:
  ingest:
    name: ingest catalog · DEV
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node (pinned by .node-version — DECISION-REGISTER D-43)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version

      # Aplica a migration de conformidade (idempotente) e faz o upsert. Node builtins apenas — sem
      # `pnpm install`, nada aqui depende de node_modules (como o deploy-dev-functions).
      - name: Ingest from Open Beauty Facts (migration + upsert via Management API)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || {
            echo "::error::SUPABASE_ACCESS_TOKEN is not set for this repository"; exit 1; }
          node scripts/ingest-catalog.mjs --apply --limit "${{ inputs.limit }}"
