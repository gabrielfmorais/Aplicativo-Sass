name: core-deno

# Proves packages/core stays consumable from Supabase Edge Functions (Deno) — CORE-RUNTIME-SPIKE.md.
# Runs on every PR so it can be a required status check that always reports
# (path-filtered required checks stay "Expected" forever on unrelated PRs and
# block merge — LEVEL 2 governance). A few extra CI minutes are cheaper than
# that governance complexity.
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'packages/core/**'
      - 'supabase/functions/**'

permissions:
  contents: read

jobs:
  deno:
    # NAME IS A CONTRACT: branch protection requires this check by name (LEVEL 2). Renaming it
    # leaves the required check "Expected" forever and blocks every merge. Add steps, not names.
    name: deno check · run smoke · lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Deno
        uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb # v2.0.3
        with:
          deno-version: v2.x

      # Every entrypoint and every module they import, plus the test files themselves — a test
      # that does not type-check is a test that is not really guarding anything. billing-webhook
      # was missing here until 2026-08-31: it shipped in SPEC-010 PR-C and was linted but never
      # type-checked.
      - name: Type-check functions, their tests, and core against Deno
        run: >-
          deno check
          health/index.ts
          generate-plan/index.ts
          generate-plan/cors.test.ts
          generate-plan/preferences.test.ts
          generate-plan/schedule-version.test.ts
          billing-webhook/index.ts
          billing-webhook/webhook.test.ts
          _spike/core-smoke.ts

      # The Edge Functions' own unit tests. Authorised 2026-08-31; until then the workflow proved
      # the functions compiled and said nothing about whether they behaved. These cover the two
      # decisions no other layer can make for them: the billing webhook's HMAC/ACL (SPEC-010 AC5)
      # and the premium gate on plan generation (SPEC-015 AC2, fail closed).
      - name: Edge Function unit tests
        run: deno test

      # D-91 — the check that was missing. Everything above type-checks the repository, where
      # `@app/core` resolves to `../../packages/core/src`. The bundler that actually deploys sees
      # only `supabase/functions`, so that mapping cannot work there, and nothing noticed until a
      # real deploy failed. This proves the *deployable* graph resolves, on every PR.
      - name: The deployable graph resolves too (staged bundle, D-91)
        working-directory: .
        run: |
          set -euo pipefail
          node scripts/stage-edge-bundle.mjs
          cd supabase/functions
          deno check --no-config --import-map import_map.deploy.json \
            health/index.ts generate-plan/index.ts billing-webhook/index.ts
          cd ../..
          node scripts/stage-edge-bundle.mjs --clean

      - name: Run core smoke under Deno
        run: deno run _spike/core-smoke.ts

      - name: Deno lint
        run: deno lint

      - name: Import map mirrors core dependencies
        working-directory: .
        run: node scripts/check-deno-import-map.mjs
